<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Application Name — Template</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    (function () {
      var mode = localStorage.getItem("mockument-theme") || "system";
      var effective = mode === "system"
        ? (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark")
        : mode;
      document.documentElement.dataset.themeMode = mode;
      document.documentElement.dataset.theme = effective;
    })();
  </script>
  <link rel="stylesheet" href="assets/template.css">
</head>
<body>
  <div class="app-shell">
    <aside class="menu-column" aria-label="Mockument navigation">
      <div class="brand">
        <span class="brand-mark"></span>
        <div><strong>Honest Mockument</strong><span id="app-name-small">Application Name</span></div>
      </div>

      <nav class="app-menu" id="app-menu"></nav>

      <div class="menu-footer">
        <button class="menu-link" id="data-dictionary-link" data-open-data-section type="button">
          <span class="menu-icon">D</span>
          <span class="menu-copy"><strong>Data Dictionary</strong></span>
        </button>
        <div class="menu-actions">
          <button class="menu-action-link" id="new-page-button" type="button">
            <span class="menu-icon">+</span><span>Copy Template</span>
          </button>
          <button class="menu-action-link" id="planned-page-button" type="button" title="Add a planned page without drawing it yet">
            <span class="menu-icon">+</span><span>Planned</span>
          </button>
          <button class="menu-action-link" id="export-button" type="button" title="Print all Mockument blocks to PDF">
            <span class="menu-icon">↓</span><span>Export PDF</span>
          </button>
          <button class="menu-action-link" id="reset-demo-button" type="button" title="Clear browser-only changes and reload the committed template menu">
            <span class="menu-icon">↺</span><span>Reset Demo</span>
          </button>
          <button class="icon-button theme-button" id="theme-button" type="button" aria-label="Change color theme" title="Theme: system">◐</button>
        </div>
        <button class="menu-link" id="settings-link" data-open-page="settings" type="button">
          <span class="menu-icon">S</span>
          <span class="menu-copy"><strong>Settings</strong><small>Mockument-wide setup</small></span>
        </button>
      </div>
    </aside>

    <main class="document-column" id="document-column" tabindex="-1">
      <div id="document"></div>
    </main>

    <aside class="inspector-column" aria-label="Selection inspector">
      <div class="inspector" id="inspector"></div>
    </aside>
  </div>

  <dialog class="dialog" id="new-page-dialog">
    <form method="dialog" id="new-page-form">
      <div class="dialog-head">
        <div>
          <span class="eyebrow" id="new-page-dialog-eyebrow">Copy Template</span>
          <h2 id="new-page-dialog-title">Create a Mockument page</h2>
        </div>
        <button class="dialog-close" value="cancel" aria-label="Close">×</button>
      </div>
      <label>Page name<input name="name" required placeholder="Page name"></label>
      <label>Route<input name="route" placeholder="/example-page"></label>
      <label>Menu placement
        <select name="parentId" id="parent-page-select">
          <option value="">Main menu section</option>
        </select>
      </label>
      <p class="form-help" id="new-page-placement-help">Leave this as Main menu section to create a new main item. Choose an existing main section to create a submenu under it.</p>
      <div class="dialog-actions">
        <button class="button" value="cancel">Cancel</button>
        <button class="button button--primary" id="new-page-submit-button" value="default">Create page</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="assets/block-definitions.js"></script>
  <script src="assets/template-menu.js"></script>
  <script src="assets/template.js"></script>
</body>
</html>
